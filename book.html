<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Call</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      height: 120px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: #ff006a;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Book a Call</h1>

  <form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST">

    <label>Your Name</label>
    <input type="text" name="name" required>

    <label>Email Address</label>
    <input type="email" name="email" required>

    <label>Choose Experience</label>
    <select name="experience" required>
      <option value="">Select one</option>
      <option>Character Call</option>
      <option>Surprise Call</option>
      <option>Fan Call</option>
    </select>

    <label>Preferred Date</label>
    <input type="date" name="date" required>

    <label>Preferred Time</label>
    <input type="time" name="time" required>

    <label>Message</label>
    <textarea name="message" placeholder="Tell us anything we should know about your call"></textarea>

    <input type="hidden" name="_subject" value="New Entertainment Call Booking">
    <input type="hidden" name="_captcha" value="false">

    <button type="submit">Request My Call</button>

  </form>

  <a class="back" href="index.html">← Back to Home</a>

</div>

</body>
</html>
